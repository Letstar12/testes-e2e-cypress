name: Testes E2E com Cypress

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar aplicação
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Aguardar aplicação
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              echo "Aplicação disponível!"
              exit 0
            fi
            sleep 2
          done
          echo "A aplicação não iniciou. Logs:"
          cat server.log
          exit 1

      - name: Executar testes E2E
        run: npx cypress run
