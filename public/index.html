<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuários</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    main {
      background: white;
      padding: 32px;
      border-radius: 12px;
      width: min(340px, calc(100% - 64px));
      box-shadow: 0 4px 18px #0001;
    }
    h1 { text-align: center; }
    label { display: block; margin-top: 14px; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin-top: 6px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: 0;
      border-radius: 6px;
      background: #2457d6;
      color: white;
      cursor: pointer;
    }
    #mensagem { margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Cadastro de Usuário</h1>
    <form id="formCadastro">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" required>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required>

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required>

      <button type="submit">Cadastrar</button>
    </form>
    <p id="mensagem" role="status" aria-live="polite"></p>
  </main>

  <script>
    const formulario = document.getElementById('formCadastro');
    const mensagem = document.getElementById('mensagem');

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      mensagem.textContent = '';

      const dados = {
        nome: formulario.nome.value.trim(),
        email: formulario.email.value.trim(),
        senha: formulario.senha.value
      };

      try {
        const resposta = await fetch('/cadastro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        const resultado = await resposta.json();
        mensagem.textContent = resultado.mensagem;

        if (resposta.ok) formulario.reset();
      } catch {
        mensagem.textContent = 'Não foi possível realizar o cadastro.';
      }
    });
  </script>
</body>
</html>
